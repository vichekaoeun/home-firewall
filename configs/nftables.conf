flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy accept;
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Allow return traffic
        ct state established,related counter accept

        # External client -> Web server
        ip saddr 10.10.10.0/24 ip daddr 10.10.20.10 tcp dport { 80, 443 } ct state new counter accept

        # DMZ web server -> Internal API
        ip saddr 10.10.20.0/24 ip daddr 10.10.30.10 tcp dport 8080 ct state new counter accept

        # Internal API -> Database
        ip saddr 10.10.30.10 ip daddr 10.10.40.20 tcp dport 5432 ct state new counter accept

        # DMZ -> Internet: HTTP and HTTPS
        ip saddr 10.10.20.0/24 oifname "eth1" tcp dport { 80, 443 } ct state new counter accept

        # Internal API -> Internet: HTTP and HTTPS
        ip saddr 10.10.30.0/24 oifname "eth1" tcp dport { 80, 443 } ct state new counter accept

        # Allow DNS over UDP and TCP from DMZ and internal API
        ip saddr { 10.10.20.0/24, 10.10.30.0/24 } oifname "eth1" udp dport 53 ct state new counter accept
        ip saddr { 10.10.20.0/24, 10.10.30.0/24 } oifname "eth1" tcp dport 53 ct state new counter accept

        counter drop
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat;
        policy accept;

        # Forward external port 8080 to DMZ web server port 80
        iifname "eth1" ip daddr 10.10.10.2 tcp dport 8080 counter dnat to 10.10.20.10:80
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;
        policy accept;

        # SNAT inbound DNAT connections to the firewall's DMZ address
        ip saddr 10.10.10.0/24 ip daddr 10.10.20.10 tcp dport 80 oifname "eth0" counter snat to 10.10.20.2

        # Masquerade DMZ and internal traffic leaving through WAN
        ip saddr { 10.10.20.0/24, 10.10.30.0/24 } oifname "eth1" masquerade
    }
}
